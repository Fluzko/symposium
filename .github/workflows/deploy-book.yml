name: Deploy mdbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook and preprocessors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm mdbook mdbook-mermaid

      - name: Build book
        run: mdbook build

      - name: Publish markdown sources
        run: |
          cp -R book/markdown/. book/html/
          cd book/markdown
          for page in \
            crate-authors/supporting-your-crate.md \
            crate-authors/authoring-a-plugin.md \
            crate-authors/writing-a-hook-handler.md \
            reference/plugin-definition.md \
            reference/skill-definition.md \
            reference/hook-events.md \
            reference/depends-on.md \
            reference/predicates.md \
            reference/plugin-source.md
          do
            printf '<!-- Source: https://symposium.dev/%s -->\n\n' "$page"
            cat "$page"
            printf '\n\n'
          done > ../html/llms-full.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
